[global]
error_log = /dev/stderr

[www]
listen = 127.0.0.1:9000

; Do not clear environment variables (allows Laravel to read them)
clear_env = no

; Catch stdout and stderr from PHP workers and forward them to the main error log
catch_workers_output = yes

; Do not decorate worker output (keeps JSON logs clean for Render)
decorate_workers_output = no

; Forward access logs to stdout
access.log = /dev/stdout
